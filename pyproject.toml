[project]
name = "zarr-reshape"
version = "0.1.0"
description = "Reshape codec for zarr-python"
readme = "README.md"
authors = [{ name = "Chris Barnes", email = "chris.barnes@gerbi-gmb.de" }]
requires-python = ">=3.12"
dependencies = ["zarr>=3.0.0"]

[project.entry-points."zarr.codecs"]
"reshape" = "zarr_reshape:ReshapeCodec"

[project.urls]
source = "https://github.com/clbarnes/zarr-python-reshape"
issues = "https://github.com/clbarnes/zarr-python-reshape/issues"
documentation = "https://zarr-python-reshape.readthedocs.io/en/stable/zarr_reshape.html"

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "doc" },
]
doc = ["pdoc>=16.0.0"]
lint = ["mypy>=1.19.1", "ruff>=0.15.12"]
test = [
    "pytest>=9.0.2",
    "numpy>=2.4.4",
    "pytest-asyncio>=1.3.0",
]
